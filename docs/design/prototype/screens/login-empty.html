<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1420">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ec-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>登入：欄位空白｜english-coach 原型</title>
<link rel="stylesheet" href="app.css">
<style>
.login{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
.login-hero{display:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.login-form{padding:max(24px,env(safe-area-inset-top)) 20px 32px;width:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
.login-form .brand.m{margin:12px 0 40px}
.lf-sub{margin:6px 0 24px}
.lf{display:grid;gap:16px}
.lf .btn{margin-top:8px}
.lf-foot{display:flex;gap:6px;align-items:center;margin-top:auto;padding-top:32px}
.today{list-style:none;padding:0;margin:32px 0 20px;display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:0}
.today li{padding:0 24px;border-left:1px solid var(--color-hero-line)} .today li:first-child{padding-left:0;border-left:0}
.today b{display:block;font-size:2.5rem;font-weight:600;color:var(--color-gold);line-height:1.1;letter-spacing:-.02em}
.today span{font-size:.8125rem;color:var(--color-on-hero-2)}
.lh-t{font-size:2.25rem;line-height:1.25;margin-top:auto}
@media (min-width:900px){
  .login{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:none;padding:16px;gap:16px}
  .login-hero{display:flex;flex-direction:column;padding:40px 48px 48px;border-radius:var(--radius-xl);min-height:calc(100vh - 32px)}
  .login-form{justify-content:center;padding:40px}
  .login-form .brand.m{display:none}
  .lf-foot{margin-top:24px}
}
</style>
</head>
<body>
<main class="login">
  <section class="login-hero hero" aria-label="今天已經排好">
    <div class="brand"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--color-hero)"/><path d="M11 25.5h18" stroke="var(--color-hero-track)" stroke-width="3" stroke-linecap="round"/><path d="M11 25.5h12" stroke="#F2C14E" stroke-width="3" stroke-linecap="round"/><path d="M11 18h18M11 12.5h10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></svg><span>english-coach</span></div>
    <h1 class="lh-t">每天 80 分鐘，<br>把英文講得像 Senior。</h1>
    <ul class="today" aria-label="今天的素材">
      <li><b class="num">1</b><span>篇科技新聞</span></li>
      <li><b class="num">5</b><span>句跟讀</span></li>
      <li><b class="num">25</b><span>張字卡</span></li>
      <li><b class="num">1</b><span>題面試題</span></li>
    </ul>
    <p class="sub t-callout">登入後就照今天的課表開始，不用準備。</p>
  </section>
  <section class="login-form" aria-labelledby="lf-h">
    <div class="brand m"><svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="var(--color-hero)"/><path d="M11 25.5h18" stroke="var(--color-hero-track)" stroke-width="3" stroke-linecap="round"/><path d="M11 25.5h12" stroke="#F2C14E" stroke-width="3" stroke-linecap="round"/><path d="M11 18h18M11 12.5h10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></svg><span>english-coach</span></div>
    <h2 id="lf-h" class="t-title1">登入</h2>
    <p class="muted lf-sub">只有你的帳號可以登入，不開放註冊。</p>
    <form action="index.html" class="lf">
      <div class="field"><label for="em">Email</label><div class="input err"><input id="em" type="email" autocomplete="username" value="" spellcheck="false" aria-invalid="true" aria-describedby="em-e"></div>
        <p class="hint err" id="em-e"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 15.5H3z"/><path d="M12 10v4.5M12 17.2v.2"/></svg>請輸入 Email。</p></div>
      <div class="field"><label for="pw">密碼</label><div class="input err"><input id="pw" type="password" autocomplete="current-password" value="" aria-invalid="true" aria-describedby="pw-e"><button class="icon-btn" type="button" aria-label="顯示密碼"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <p class="hint err" id="pw-e"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 15.5H3z"/><path d="M12 10v4.5M12 17.2v.2"/></svg>請輸入密碼。</p></div>
      <button class="btn btn-lg btn-block" type="submit">登入</button>
    </form>
    <p class="t-caption muted lf-foot"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg>連線加密。履歷與錄音只供你自己練習。</p>
  </section>
</main>
<div class="sheet pop" id="account" role="dialog" aria-modal="true" aria-labelledby="acc-h">
  <a class="scrim" href="#" aria-label="關閉"></a>
  <div class="card">
    <div class="grab" aria-hidden="true"></div>
    <div class="card-h"><h2 id="acc-h">帳號與外觀</h2><a class="icon-btn" href="#" aria-label="關閉"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></a></div>
    <div class="acc-me"><span class="avatar-lg" aria-hidden="true">H</span><div><b>Hansheng</b><p class="t-callout muted">hansheng@example.com</p></div></div>
    <fieldset class="seg lg theme-seg">
      <legend>外觀</legend>
      <label><input type="radio" name="theme-acc" data-theme-input value="light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg>淺色</label>
      <label><input type="radio" name="theme-acc" data-theme-input value="dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>深色</label>
      <label><input type="radio" name="theme-acc" data-theme-input value="system"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>跟隨系統</label>
    </fieldset>
    <p class="t-callout muted theme-now" data-theme-now aria-live="polite">跟隨系統</p>
    <hr class="hr">
    <a class="acc-row" href="later.html?s=settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.25"/><circle cx="8" cy="17" r="2.25"/></svg><span>設定</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a class="acc-row" href="login.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5h4.5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H14M10 8l-4 4 4 4M6 12h9"/></svg><span>登出</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
  </div>
</div>
<script>/* 原型的主題切換：對齊 ADR-014。localStorage['ec-theme'] = system | light | dark；只有 light／dark 會設 data-theme。?theme= 只供截圖與預覽，不存。 */
(function(){var d=document.documentElement,K='ec-theme',mq=matchMedia('(prefers-color-scheme: dark)'),metas=[].slice.call(document.querySelectorAll('meta[name="theme-color"]'));
function pref(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:'system'}catch(e){return 'system'}}
function paint(){var dark=d.dataset.theme?d.dataset.theme==='dark':mq.matches;
 metas.forEach(function(m,i){if(d.dataset.theme){m.setAttribute('content',dark?'#0A1420':'#F4F5F7');m.removeAttribute('media')}else{m.setAttribute('content',i?'#0A1420':'#F4F5F7');m.setAttribute('media','(prefers-color-scheme: '+(i?'dark':'light')+')')}});
 document.querySelectorAll('[data-theme-now]').forEach(function(e){e.textContent=(d.dataset.theme?'':'跟隨系統，')+'現在是'+(dark?'深色':'淺色')+'。只存在這台裝置。'})}
var cur=d.dataset.theme||pref();
var ins=[].slice.call(document.querySelectorAll('input[data-theme-input]'));ins.forEach(function(r){r.checked=r.value===cur;r.addEventListener('change',function(){try{localStorage.setItem(K,r.value)}catch(e){}if(r.value==='system')delete d.dataset.theme;else d.dataset.theme=r.value;ins.forEach(function(o){o.checked=o.value===r.value});paint()})});
mq.addEventListener&&mq.addEventListener('change',paint);paint()})();</script>

</body>
</html>
