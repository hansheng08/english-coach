<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1420">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ec-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>PWA 圖示｜english-coach 原型</title>
<link rel="stylesheet" href="app.css">
<style>
.pi .mk-row{display:flex;flex-wrap:wrap;gap:20px 24px;margin:4px 0 12px}
.mk-cell{display:grid;justify-items:center;gap:8px;margin:0;max-width:160px;text-align:center}
.mk-cell figcaption,.any-row figcaption{font-size:.75rem;color:var(--color-ink-2)}
.mk-cell img{display:block}
.safe{position:relative;display:block}
.safe i{position:absolute;inset:10%;border-radius:50%;border:2px dashed var(--color-gold)}
.pi-2{display:grid;gap:12px}
.any-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px;margin:4px 0 12px}
.any-row figure{display:grid;justify-items:center;gap:8px;margin:0}
.home span{font-size:.75rem;color:var(--color-ink)}
.home{padding:14px 18px;border-radius:var(--radius-md);background:var(--color-sunken)}
.sp{display:grid;justify-items:center;align-content:center;gap:14px;width:150px;height:240px;border-radius:var(--radius-lg);background:var(--color-hero);color:var(--color-on-hero)}
.sp b{font-size:.8125rem;font-weight:600}
@media (min-width:900px){.pi-2{grid-template-columns:1fr 1fr;gap:16px}}
</style>
</head>
<body>
<header class="navbar"><div class="in"><a class="back" href="system.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>設計系統</a><h1>PWA 圖示與 manifest</h1><div class="side-r"><a class="avatar" href="#account" aria-label="帳號與外觀"><span>H</span></a></div></div></header>

  <section class="panel"><div class="panel-h"><h2>maskable 圖示在各種遮罩下（512 px 縮小顯示）</h2></div>

      <figure class="mk-cell"><img src="../../assets/icons/icon-maskable-512.png" width="136" height="136" alt="" style="border-radius:50%"><figcaption>圓形</figcaption></figure><figure class="mk-cell"><img src="../../assets/icons/icon-maskable-512.png" width="136" height="136" alt="" style="clip-path:path('M136.0 68.0 L135.9 93.6 L135.6 101.8 L135.1 107.6 L134.3 112.3 L133.4 116.2 L132.2 119.5 L130.8 122.4 L129.1 125.0 L127.2 127.2 L125.0 129.1 L122.4 130.8 L119.5 132.2 L116.2 133.4 L112.3 134.3 L107.6 135.1 L101.8 135.6 L93.6 135.9 L68.0 136.0 L42.4 135.9 L34.2 135.6 L28.4 135.1 L23.7 134.3 L19.8 133.4 L16.5 132.2 L13.6 130.8 L11.0 129.1 L8.8 127.2 L6.9 125.0 L5.2 122.4 L3.8 119.5 L2.6 116.2 L1.7 112.3 L0.9 107.6 L0.4 101.8 L0.1 93.6 L0.0 68.0 L0.1 42.4 L0.4 34.2 L0.9 28.4 L1.7 23.7 L2.6 19.8 L3.8 16.5 L5.2 13.6 L6.9 11.0 L8.8 8.8 L11.0 6.9 L13.6 5.2 L16.5 3.8 L19.8 2.6 L23.7 1.7 L28.4 0.9 L34.2 0.4 L42.4 0.1 L68.0 0.0 L93.6 0.1 L101.8 0.4 L107.6 0.9 L112.3 1.7 L116.2 2.6 L119.5 3.8 L122.4 5.2 L125.0 6.9 L127.2 8.8 L129.1 11.0 L130.8 13.6 L132.2 16.5 L133.4 19.8 L134.3 23.7 L135.1 28.4 L135.6 34.2 L135.9 42.4 Z')"><figcaption>方圓（squircle）</figcaption></figure><figure class="mk-cell"><img src="../../assets/icons/icon-maskable-512.png" width="136" height="136" alt="" style="border-radius:22%"><figcaption>圓角方形</figcaption></figure><figure class="mk-cell"><img src="../../assets/icons/icon-maskable-512.png" width="136" height="136" alt="" style="border-radius:50% 50% 50% 14%"><figcaption>水滴</figcaption></figure>
    </div>
    <p class="muted t-callout">內容（三條線）最遠的角落離中心 169 px，是安全區半徑 204.8 px 的 83%；任何遮罩都不會切到線條。</p>
  </section>
  <div class="pi-2">
    <section class="panel"><div class="panel-h"><h2>一般圖示（purpose: any）</h2></div>
      <div class="any-row"><figure><img src="../../assets/icons/icon-512.png" width="128" height="128" alt="一般圖示 512"><figcaption>512</figcaption></figure><figure><img src="../../assets/icons/icon-192.png" width="96" height="96" alt="一般圖示 192"><figcaption>192</figcaption></figure><figure><img src="../../assets/icons/icon-192.png" width="48" height="48" alt="一般圖示 48"><figcaption>48</figcaption></figure></div>
      <p class="muted t-callout">電腦版 Chrome／Edge 安裝後的視窗與工作列用這張（透明圓角，不加遮罩）。</p>
    </section>
    <section class="panel"><div class="panel-h"><h2>主畫面與啟動畫面（示意）</h2></div>
      <div class="any-row">
        <figure class="home"><img src="../../assets/icons/icon-maskable-192.png" width="60" height="60" alt="" style="border-radius:50%"><span>EN Coach</span><figcaption>主畫面（short_name）</figcaption></figure>
        <figure class="splash"><span class="sp"><img src="../../assets/icons/icon-maskable-192.png" width="72" height="72" alt="" style="border-radius:50%"><b>english-coach</b></span><figcaption>啟動畫面（background_color＋name）</figcaption></figure>
      </div>
    </section>
  </div>
</main>
<div class="sheet pop" id="account" role="dialog" aria-modal="true" aria-labelledby="acc-h">
  <a class="scrim" href="#" aria-label="關閉"></a>
  <div class="card">
    <div class="grab" aria-hidden="true"></div>
    <div class="card-h"><h2 id="acc-h">帳號與外觀</h2><a class="icon-btn" href="#" aria-label="關閉"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></a></div>
    <div class="acc-me"><span class="avatar-lg" aria-hidden="true">H</span><div><b>Hansheng</b><p class="t-callout muted">hansheng@example.com</p></div></div>
    <fieldset class="seg lg theme-seg">
      <legend>外觀</legend>
      <label><input type="radio" name="theme-acc" data-theme-input value="light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg>淺色</label>
      <label><input type="radio" name="theme-acc" data-theme-input value="dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>深色</label>
      <label><input type="radio" name="theme-acc" data-theme-input value="system"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>跟隨系統</label>
    </fieldset>
    <p class="t-callout muted theme-now" data-theme-now aria-live="polite">跟隨系統</p>
    <hr class="hr">
    <a class="acc-row" href="settings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.25"/><circle cx="8" cy="17" r="2.25"/></svg><span>設定</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a class="acc-row" href="login.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5h4.5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H14M10 8l-4 4 4 4M6 12h9"/></svg><span>登出</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
  </div>
</div>
<script>/* 原型的主題切換：對齊 ADR-014。localStorage['ec-theme'] = system | light | dark；只有 light／dark 會設 data-theme。?theme= 只供截圖與預覽，不存。 */
(function(){var d=document.documentElement,K='ec-theme',mq=matchMedia('(prefers-color-scheme: dark)'),metas=[].slice.call(document.querySelectorAll('meta[name="theme-color"]'));
function pref(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:'system'}catch(e){return 'system'}}
function paint(){var dark=d.dataset.theme?d.dataset.theme==='dark':mq.matches;
 metas.forEach(function(m,i){if(d.dataset.theme){m.setAttribute('content',dark?'#0A1420':'#F4F5F7');m.removeAttribute('media')}else{m.setAttribute('content',i?'#0A1420':'#F4F5F7');m.setAttribute('media','(prefers-color-scheme: '+(i?'dark':'light')+')')}});
 document.querySelectorAll('[data-theme-now]').forEach(function(e){e.textContent=(d.dataset.theme?'':'跟隨系統，')+'現在是'+(dark?'深色':'淺色')+'。只存在這台裝置。'})}
var cur=d.dataset.theme||pref();
var ins=[].slice.call(document.querySelectorAll('input[data-theme-input]'));ins.forEach(function(r){r.checked=r.value===cur;r.addEventListener('change',function(){try{localStorage.setItem(K,r.value)}catch(e){}if(r.value==='system')delete d.dataset.theme;else d.dataset.theme=r.value;ins.forEach(function(o){o.checked=o.value===r.value});paint()})});
mq.addEventListener&&mq.addEventListener('change',paint);paint()})();</script>
