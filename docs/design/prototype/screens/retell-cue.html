<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F5F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A1420">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ec-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<title>晚上｜無稿重答｜english-coach 原型</title>
<link rel="stylesheet" href="app.css">
<style>
.cuecard{min-height:calc(100vh - 92px);display:flex;flex-direction:column}
.cu-q{font-size:1rem;font-weight:500;color:var(--color-on-hero-2);margin:10px 0 0;line-height:1.5}
.cues{list-style:none;margin:auto 0;padding:24px 0;display:grid;gap:14px}
.cues li{display:flex;gap:14px;align-items:baseline;font-size:1.75rem;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.cn{font-size:.875rem;color:var(--color-gold);font-weight:600;width:1.2em;flex:none}
.cu-rec{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.cu-rec .level{justify-self:start}
.kbh{margin-left:6px;color:var(--color-on-hero)}
@media (min-width:900px){
  .cuecard{min-height:calc(100vh - 140px);padding:40px 64px}
  .cues li{font-size:2.5rem}
  .cu-q{font-size:1.125rem}
}
</style>
</head>
<body>
<header class="navbar"><div class="in">
  <a class="back" href="retell.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>跟讀</a>
  <h1>晚上｜無稿重答</h1>
  <div class="side-r"><a class="avatar" href="#account" aria-label="帳號與外觀"><span>H</span></a></div>
</div></header>
<main class="page flow cue">
  <section class="hero cuecard" aria-labelledby="cu-h">
    <div class="eyebrow"><span>無稿提示模式</span><span class="num">0:48</span></div>
    <h2 id="cu-h" class="cu-q" lang="en">Tell me about a time you debugged a production issue under pressure.</h2>
    <ol class="cues"><li><span class="cn num">1</span><span lang="en">took the line down</span></li><li><span class="cn num">2</span><span lang="en">dug into</span></li><li><span class="cn num">3</span><span lang="en">traced it to</span></li></ol>
    <div class="cu-rec"><div class="level" aria-hidden="true"><i style="--l:0.4;--d:0"></i><i style="--l:0.7;--d:1"></i><i style="--l:0.5;--d:2"></i><i style="--l:0.9;--d:3"></i><i style="--l:0.6;--d:4"></i><i style="--l:0.3;--d:5"></i><i style="--l:0.8;--d:6"></i><i style="--l:0.55;--d:7"></i><i style="--l:0.35;--d:8"></i><i style="--l:0.65;--d:9"></i><i style="--l:0.85;--d:10"></i><i style="--l:0.5;--d:11"></i></div><a class="recbtn stop pulsing" href="result.html" aria-label="停止並送出"><i></i></a><span class="t-callout sub">說完按停止<kbd class="kbh">Space</kbd></span></div>
  </section>
</main>
<div class="sheet pop" id="account" role="dialog" aria-modal="true" aria-labelledby="acc-h">
  <a class="scrim" href="#" aria-label="關閉"></a>
  <div class="card">
    <div class="grab" aria-hidden="true"></div>
    <div class="card-h"><h2 id="acc-h">帳號與外觀</h2><a class="icon-btn" href="#" aria-label="關閉"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></a></div>
    <div class="acc-me"><span class="avatar-lg" aria-hidden="true">H</span><div><b>Hansheng</b><p class="t-callout muted">hansheng@example.com</p></div></div>
    <fieldset class="seg lg theme-seg">
      <legend>外觀</legend>
      <label><input type="radio" name="theme-acc" data-theme-input value="light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.75v2M12 19.25v2M2.75 12h2M19.25 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></svg>淺色</label>
      <label><input type="radio" name="theme-acc" data-theme-input value="dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>深色</label>
      <label><input type="radio" name="theme-acc" data-theme-input value="system"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>跟隨系統</label>
    </fieldset>
    <p class="t-callout muted theme-now" data-theme-now aria-live="polite">跟隨系統</p>
    <hr class="hr">
    <a class="acc-row" href="later.html?s=settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.25"/><circle cx="8" cy="17" r="2.25"/></svg><span>設定</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    <a class="acc-row" href="login.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4.5h4.5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H14M10 8l-4 4 4 4M6 12h9"/></svg><span>登出</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
  </div>
</div>
<script>/* 原型的主題切換：對齊 ADR-014。localStorage['ec-theme'] = system | light | dark；只有 light／dark 會設 data-theme。?theme= 只供截圖與預覽，不存。 */
(function(){var d=document.documentElement,K='ec-theme',mq=matchMedia('(prefers-color-scheme: dark)'),metas=[].slice.call(document.querySelectorAll('meta[name="theme-color"]'));
function pref(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:'system'}catch(e){return 'system'}}
function paint(){var dark=d.dataset.theme?d.dataset.theme==='dark':mq.matches;
 metas.forEach(function(m,i){if(d.dataset.theme){m.setAttribute('content',dark?'#0A1420':'#F4F5F7');m.removeAttribute('media')}else{m.setAttribute('content',i?'#0A1420':'#F4F5F7');m.setAttribute('media','(prefers-color-scheme: '+(i?'dark':'light')+')')}});
 document.querySelectorAll('[data-theme-now]').forEach(function(e){e.textContent=(d.dataset.theme?'':'跟隨系統，')+'現在是'+(dark?'深色':'淺色')+'。只存在這台裝置。'})}
var cur=d.dataset.theme||pref();
var ins=[].slice.call(document.querySelectorAll('input[data-theme-input]'));ins.forEach(function(r){r.checked=r.value===cur;r.addEventListener('change',function(){try{localStorage.setItem(K,r.value)}catch(e){}if(r.value==='system')delete d.dataset.theme;else d.dataset.theme=r.value;ins.forEach(function(o){o.checked=o.value===r.value});paint()})});
mq.addEventListener&&mq.addEventListener('change',paint);paint()})();</script>

</body>
</html>
