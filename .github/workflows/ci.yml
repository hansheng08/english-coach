name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'task/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'
  ACTIONLINT_VERSION: '1.7.12'
  SUPABASE_CLI_VERSION: '3.2.0'

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_node: ${{ steps.flags.outputs.has_node }}
      has_web: ${{ steps.flags.outputs.has_web }}
      has_supabase: ${{ steps.flags.outputs.has_supabase }}
      has_e2e: ${{ steps.flags.outputs.has_e2e }}
      is_pr: ${{ steps.flags.outputs.is_pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect what exists
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flag() { if "$@"; then echo true; else echo false; fi; }
          has_node=$(flag sh -c 'test -f package.json && test -f pnpm-lock.yaml')
          has_web=$(flag test -f apps/web/package.json)
          has_supabase=$(flag sh -c 'test -f supabase/config.toml || test -f .github/ci/supabase-probe/supabase/config.toml')
          has_e2e=$(flag sh -c 'test -f playwright.config.ts || test -f playwright.config.js')
          is_pr=$(flag test "$EVENT_NAME" = pull_request)
          {
            echo "has_node=$has_node"
            echo "has_web=$has_web"
            echo "has_supabase=$has_supabase"
            echo "has_e2e=$has_e2e"
            echo "is_pr=$is_pr"
          } | tee -a "$GITHUB_OUTPUT"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -fsSL --retry 3 -O "${base}/${archive}"
          curl -fsSL --retry 3 -O "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${archive}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint -color

  pushguard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test pushguard, settings, ci-ok, and O-004/O-005 verify scripts
        run: |
          node --test \
            .claude/hooks/pushguard/guard.test.mjs \
            .claude/hooks/pushguard/settings.test.mjs \
            .github/scripts/ci-ok.test.mjs \
            .github/scripts/detect-resplit.test.mjs \
            .github/scripts/run-task-summary.test.mjs \
            .github/scripts/fail-open-lint.test.mjs \
            .github/scripts/post-run-task-comment.test.mjs \
            .github/scripts/claude-permission-check.test.mjs
          bash .github/scripts/adr010-keycheck-test.sh
          bash .github/scripts/db-auth-check-test.sh
          bash .github/scripts/verify-push-test.sh
          bash .github/scripts/run-task-outcome-test.sh
          bash .github/scripts/run-task-summary-step-test.sh
          node .github/scripts/claude-permission-check.mjs .
          node .github/scripts/fail-open-lint.mjs .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -O "${base}/${archive}"
          curl -fsSL --retry 3 -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan full git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner
      - name: Self-test the scanner
        run: node .github/scripts/secret-selftest.mjs

  check:
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: arch
        run: pnpm arch
      - name: test
        run: pnpm test

  bundle:
    needs: detect
    if: needs.detect.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -O "${base}/${archive}"
          curl -fsSL --retry 3 -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan build output
        run: gitleaks dir apps/web/dist --config .gitleaks.toml --redact --no-banner

  db:
    needs: detect
    if: needs.detect.outputs.has_supabase == 'true' && needs.detect.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker
        run: docker info
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Verify local Supabase, Auth (signup off), functions health, ADR-009 (1)(2), ADR-010 keys
        run: bash .github/scripts/db-job-verify.sh

  e2e:
    needs: detect
    if: needs.detect.outputs.has_e2e == 'true' && needs.detect.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e (fake providers)
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: supabase stop

  ci-ok:
    needs: [detect, actionlint, pushguard, secrets, check, bundle, db, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-ok.mjs
