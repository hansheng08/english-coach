name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'task/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'
  ACTIONLINT_VERSION: '1.7.12'
  SUPABASE_CLI_VERSION: '3.2.0'

jobs:
  # O-015: detect, actionlint, pushguard and secrets merged into one job
  # (each job bills at least one minute). The security steps (actionlint,
  # pushguard tests, gitleaks, scanner self-test) have no mode condition, only
  # `!cancelled()` (C7), so they run in every mode and all report even if an
  # earlier step failed. The mode step (C1-C3) decides full / docs / light;
  # see .github/scripts/ci-guard-mode.sh and docs/RUNBOOK.md §6.3.
  ci-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions replace the workflow-level block (C6).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_node: ${{ steps.flags.outputs.has_node }}
      has_web: ${{ steps.flags.outputs.has_web }}
      has_supabase: ${{ steps.flags.outputs.has_supabase }}
      has_e2e: ${{ steps.flags.outputs.has_e2e }}
      is_pr: ${{ steps.flags.outputs.is_pr }}
      mode: ${{ steps.mode.outputs.mode }}
      tasks_changed: ${{ steps.mode.outputs.tasks_changed }}
      pr_number: ${{ steps.mode.outputs.pr_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Detect what exists
        id: flags
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          flag() { if "$@"; then echo true; else echo false; fi; }
          has_node=$(flag sh -c 'test -f package.json && test -f pnpm-lock.yaml')
          has_web=$(flag test -f apps/web/package.json)
          has_supabase=$(flag sh -c 'test -f supabase/config.toml || test -f .github/ci/supabase-probe/supabase/config.toml')
          has_e2e=$(flag sh -c 'test -f playwright.config.ts || test -f playwright.config.js')
          is_pr=$(flag test "$EVENT_NAME" = pull_request)
          {
            echo "has_node=$has_node"
            echo "has_web=$has_web"
            echo "has_supabase=$has_supabase"
            echo "has_e2e=$has_e2e"
            echo "is_pr=$is_pr"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Decide CI mode (full / docs / light)
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-guard-mode.sh
      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          (
            cd "$RUNNER_TEMP/actionlint"
            curl -fsSL --retry 3 -O "${base}/${archive}"
            curl -fsSL --retry 3 -O "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
            grep " ${archive}\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "$archive" actionlint
          )
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: pushguard tests
        if: ${{ !cancelled() }}
        run: |
          node --test \
            .claude/hooks/pushguard/guard.test.mjs \
            .claude/hooks/pushguard/settings.test.mjs \
            .github/scripts/ci-ok.test.mjs \
            .github/scripts/ci-workflow-check.test.mjs \
            .github/scripts/detect-resplit.test.mjs \
            .github/scripts/run-task-summary.test.mjs \
            .github/scripts/fail-open-lint.test.mjs \
            .github/scripts/post-run-task-comment.test.mjs \
            .github/scripts/claude-permission-check.test.mjs
          bash .github/scripts/adr010-keycheck-test.sh
          bash .github/scripts/db-auth-check-test.sh
          bash .github/scripts/verify-push-test.sh
          bash .github/scripts/run-task-outcome-test.sh
          bash .github/scripts/run-task-summary-step-test.sh
          bash .github/scripts/taskcheck-test.sh
          bash .github/scripts/g3-comment-guard-test.sh
          bash .github/scripts/run-task-post-check-test.sh
          bash .github/scripts/run-task-pre-head-test.sh
          bash .github/scripts/run-task-usage-limit-test.sh
          bash .github/scripts/ci-guard-mode-test.sh
          bash .github/scripts/pr-body-check-test.sh
          node .github/scripts/claude-permission-check.mjs .
          node .github/scripts/fail-open-lint.mjs .
          node .github/scripts/ci-workflow-check.mjs .
      - name: gitleaks (full history)
        if: ${{ !cancelled() }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          (
            cd "$RUNNER_TEMP/gitleaks"
            curl -fsSL --retry 3 -O "${base}/${archive}"
            curl -fsSL --retry 3 -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "$archive" gitleaks
          )
          "$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner
      - name: secret scanner self-test
        if: ${{ !cancelled() }}
        run: PATH="$RUNNER_TEMP/gitleaks:$PATH" node .github/scripts/secret-selftest.mjs
      # O-016: a PR that changes .github/workflows/** must fill in「Actions 分鐘數影響」.
      # Reads the CURRENT description via the API (pull-requests: read); ci.yml does
      # not run on `edited`, so after editing the description push or rerun.
      - name: 'PR description: Actions 分鐘數影響'
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/pr-body-check.sh

  check:
    needs: ci-guard
    if: needs.ci-guard.outputs.mode == 'full' && needs.ci-guard.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: arch
        run: pnpm arch
      - name: test
        run: pnpm test

  # O-008: charter v6 §13 task-file lint, scope check and AC coverage.
  # main push: task-lint the docs/tasks/*.md added or modified by the push.
  # task/** and (O-009) fix/** push and PR: scope-check (diff must stay inside
  # the task file's 檔案範圍), ac-coverage (every AC / TC id has a passed
  # Vitest test), report-lint (changed docs/reports/*.md), run-mutants (QA's
  # docs/qa/mutants/<branch id>.json, only when it exists) and verify-summary
  # (自動驗證摘要 in the job summary). See taskcheck.sh.
  # Other refs skip this job; ci-ok lists it as "Skipped (not verified)".
  taskcheck:
    needs: [ci-guard, e2e]
    # O-015: full mode as before; docs mode only when docs/tasks/ changed
    # (main push = task-lint); light mode never (the PR run is authoritative).
    # O-025: also needs e2e so the Playwright JSON artifact can be downloaded.
    # always() lets the job start after a failed e2e (missing JSON must
    # fail-closed). The needs.e2e.result clause keeps the job running when
    # e2e is skipped; without it a skipped e2e would skip taskcheck too.
    if: >-
      always() &&
      !cancelled() &&
      needs.ci-guard.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'failure' || needs.e2e.result == 'skipped') &&
      needs.ci-guard.outputs.has_node == 'true' &&
      ((needs.ci-guard.outputs.mode == 'full' &&
        ((github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'task/') || startsWith(github.ref_name, 'fix/'))) ||
         (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'task/') || startsWith(github.head_ref, 'fix/'))))) ||
       (needs.ci-guard.outputs.mode == 'docs' && needs.ci-guard.outputs.tasks_changed == 'true'))
    runs-on: ubuntu-latest
    # O-009: run-mutants runs the Vitest suite once per QA mutant.
    # O-010: + local Supabase start and pnpm db:test.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O-010: taskcheck.sh runs `pnpm db:test` (psql + pgTAP against the
      # local Supabase DB) when supabase/config.toml exists, and feeds every
      # TAP file to ac-coverage. Not started for main pushes (task-lint only).
      # Fail-closed: if this start fails the job fails; if it is skipped while
      # config.toml exists, db-test cannot connect and taskcheck fails.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: hashFiles('supabase/config.toml') != '' && !(github.event_name == 'push' && github.ref_name == 'main')
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase for pnpm db:test
        if: hashFiles('supabase/config.toml') != '' && !(github.event_name == 'push' && github.ref_name == 'main')
        run: |
          psql --version
          supabase start -x studio,imgproxy,logflare,vector,mailpit,realtime,postgres-meta,supavisor
      - name: Download Playwright JSON results
        if: needs.e2e.result == 'success' || needs.e2e.result == 'failure'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: playwright-results
          path: ${{ runner.temp }}/playwright-results
      - name: Task lint / scope check / db-test / AC coverage / report lint / mutants / summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PLAYWRIGHT_JSON: ${{ runner.temp }}/playwright-results/playwright-results.json
        run: bash .github/scripts/taskcheck.sh

  bundle:
    needs: ci-guard
    if: needs.ci-guard.outputs.mode == 'full' && needs.ci-guard.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O-023: mock-mode guard before build. Fail-closed if VITE_DATA_MODE is
      # missing/invalid or any VITE_SUPABASE_* is present (including empty).
      # Do not unset violating keys to pass. timeout-minutes stays 10; no new job.
      - name: Check VITE_DATA_MODE=mock
        env:
          VITE_DATA_MODE: mock
        run: node tooling/data-mode-guard.mjs
      - name: Build
        env:
          VITE_DATA_MODE: mock
        run: pnpm build
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSL --retry 3 -O "${base}/${archive}"
          curl -fsSL --retry 3 -O "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan build output
        run: gitleaks dir apps/web/dist --config .gitleaks.toml --redact --no-banner

  db:
    needs: ci-guard
    if: needs.ci-guard.outputs.mode == 'full' && needs.ci-guard.outputs.has_supabase == 'true' && needs.ci-guard.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Docker
        run: docker info
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Verify local Supabase, Auth (signup off), functions health, ADR-009 (1)(2), ADR-010 keys
        run: bash .github/scripts/db-job-verify.sh

  e2e:
    needs: ci-guard
    if: needs.ci-guard.outputs.mode == 'full' && needs.ci-guard.outputs.has_e2e == 'true' && needs.ci-guard.outputs.is_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,logflare,vector
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e (fake providers)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: pnpm e2e --reporter=list --reporter=json
      - name: Upload Playwright JSON results
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: playwright-results.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: supabase stop

  # O-015 C4: only the pull_request run produces a check named exactly
  # `ci-ok` (the required check). Push and workflow_dispatch runs are named
  # `ci-ok (push)` / `ci-ok (workflow_dispatch)`, so a push run can never
  # satisfy the required check. Job id (and needs key) stays `ci-ok`.
  ci-ok:
    name: ${{ github.event_name == 'pull_request' && 'ci-ok' || format('ci-ok ({0})', github.event_name) }}
    needs: [ci-guard, check, bundle, db, e2e, taskcheck]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Decide
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_MODE: ${{ needs.ci-guard.outputs.mode }}
          TASKS_CHANGED: ${{ needs.ci-guard.outputs.tasks_changed }}
          PR_NUMBER: ${{ needs.ci-guard.outputs.pr_number }}
          HAS_NODE: ${{ needs.ci-guard.outputs.has_node }}
          HAS_WEB: ${{ needs.ci-guard.outputs.has_web }}
          HAS_SUPABASE: ${{ needs.ci-guard.outputs.has_supabase }}
          HAS_E2E: ${{ needs.ci-guard.outputs.has_e2e }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: node .github/scripts/ci-ok.mjs
