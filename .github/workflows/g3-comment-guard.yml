name: g3-comment-guard

# O-009 (charter v6 §9, §1.1): G3 PRs must not carry a "TechLead Review"
# comment, and QA comments must not show a local rerun of pnpm check /
# pg_prove (QA cites the PR CI run instead). All bots comment as hansheng08,
# so tooling/comment-lint.mjs classifies by leading text only.
#
# Comment events do not re-run ci.yml, so this is NOT part of ci-ok: the
# result is the commit status "g3-comment-guard" on the PR head. Whether it
# becomes a required check in branch protection is Hansheng's decision.
# issue_comment / review events run the workflow from the default branch
# (they never check out PR code); pull_request runs it from the PR merge ref.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: g3-comment-guard-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    # issue_comment also fires on plain issues; only PR comments are checked.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check G3 PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/g3-comment-guard.sh
