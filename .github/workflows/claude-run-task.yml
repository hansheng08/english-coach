name: Claude Run Task

on:
  repository_dispatch:
    types: [run-task]

concurrency:
  group: claude-run-task-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write — Claude Code may commit via the action; official action
      # documents repo write. Push itself uses the Claude GitHub App (OIDC),
      # but we cannot prove the action never uses GITHUB_TOKEN for repo writes.
      # Also used to post a commit comment when no PR exists yet (C3 fallback).
      contents: write
      # id-token: write — required to exchange OIDC for the Claude GitHub App token (O-002 A').
      id-token: write
      # actions: read — Verify push triggered CI uses gh run list with github.token.
      actions: read
      # pull-requests: write — C3 posts a run-task summary (denial count,
      # Duration, test excerpt) on an *existing* PR for the task branch.
      # If no PR exists, or gh pr comment returns HTTP 403, post a commit
      # comment instead (contents: write). This step does not open a PR.
      pull-requests: write
    steps:
      - name: Validate task id
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: |
          if [[ ! "$TASK" =~ ^[TQOAP]-[0-9]{3}(-fix[0-9]+)?$ ]]; then
            echo "Invalid task id: $TASK"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Must stay false (RUNBOOK §1.1): a persisted GITHUB_TOKEN header would
          # override the Claude App token and the push would not trigger CI.
          # claude-permission-check.mjs fails if this is removed or set to true.
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      # O-008: reject a task file that breaks charter v6 §13 before Claude
      # starts (0 turns spent). tooling/task-lint.mjs uses Node built-ins only,
      # so no pnpm install is needed. Fail-closed: any lint error exits 1, the
      # Claude step is skipped (default success() condition) and Notify sends
      # outcome=task_lint_failed.
      - name: Task lint
        id: task_lint
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: node tooling/task-lint.mjs "docs/tasks/${TASK}.md"

      # O-012: record the branch the task file names and its current head
      # BEFORE Claude, so the post-check can run scope-check --all-non-qa on
      # exactly this run's commits (QA-owned files may not be touched by any
      # Claude commit, whatever its prefix or author). Fail-closed: an error
      # skips Claude (default success() condition) and Notify reports failure.
      - name: Record branch head before Claude
        id: pre_head
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: bash .github/scripts/run-task-pre-head.sh

      # O-010: start the local Supabase stack before Claude so a task whose
      # 驗證方式 lists `pnpm db:test` can run pgTAP (psql) against it.
      # Fail-closed: a failed install/start skips Claude (default success()
      # condition) and Notify reports a failure. Same CLI pin and excludes as
      # ci.yml (db job / taskcheck). 待下次真實 run-task 實測驗證.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: hashFiles('supabase/config.toml') != ''
        with:
          version: '3.2.0'

      - name: Start local Supabase for pnpm db:test
        id: supabase_start
        if: hashFiles('supabase/config.toml') != ''
        run: |
          psql --version
          supabase start -x studio,imgproxy,logflare,vector,mailpit,realtime,postgres-meta,supavisor

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1 (v1.0.289)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/cursor/plugins.git"
          plugins: "pstack@cursor-plugins"
          prompt: |
            /pstack:poteto-mode 執行任務單 docs/tasks/${{ github.event.client_payload.task }}.md（任務編號 ${{ github.event.client_payload.task }}）。你在 GitHub Actions 上無人值守地執行，沒有人能回答問題，不要停下來等回覆。完整遵守 .claude/skills/run-task/SKILL.md 的步驟與限制：依任務單的分支規則工作、驗證方式以任務單為準、結果寫到 docs/reports/<任務編號>.md、commit 並推送分支、不開 PR、不合併、不動 main。
          claude_args: '--max-turns 200 --allowedTools "Read, Write, Edit, Glob, Grep, Bash(git *), Bash(pnpm install --frozen-lockfile*), Bash(pnpm install --no-frozen-lockfile), Bash(pnpm check *), Bash(pnpm typecheck *), Bash(pnpm lint *), Bash(pnpm arch *), Bash(pnpm test *), Bash(pnpm e2e *), Bash(pnpm db:test*), Agent, TodoWrite"'

      - name: Summarize permission denials
        if: always()
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG:-}" || ! -f "$LOG" ]]; then
            if [[ "${CLAUDE_OUTCOME}" == "success" ]]; then
              echo "ERROR: claude outcome is success but execution_file is missing or unreadable: '${LOG}'"
              exit 1
            fi
            echo "No execution_file; skip denial summary (claude outcome=${CLAUDE_OUTCOME:-unknown})."
            exit 0
          fi
          DENIALS=$(jq '[.[] | select(.type=="result") | .permission_denials // []] | add // []' "$LOG")
          COUNT=$(jq 'length' <<<"$DENIALS")
          {
            echo "## Claude permission denials"
            echo "count: $COUNT"
            jq -r '.[]? | "- `\(.tool_name)`: \(.tool_input.command // "(no command field)")"' <<<"$DENIALS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$COUNT" -gt 0 ]]; then
            echo "::warning::Claude had $COUNT permission denial(s). See job summary and artifact."
          fi

      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output-${{ github.event.client_payload.task }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 7

      # O-014: Claude usage limit (result is_error + api_error=usage_limit_reached
      # + api_error_status 429; T-023 run 45545848159). tooling/usage-limit.mjs
      # reads the execution file (reset time = last rejected rate_limit_event
      # resetsAt); on a usage limit the previous result of the same task comes
      # from the newest artifact run-task-outcome-<task> of another run
      # (gh api …/actions/artifacts?name=, actions: read). Fail-closed: an
      # unreadable execution file fails this step and Notify keeps
      # outcome=failure; an unknown previous result gives streak unknown +
      # action stop. Runs even when Claude is skipped (then not a usage limit).
      - name: Detect Claude usage limit
        id: usage_limit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TASK: ${{ github.event.client_payload.task }}
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: bash .github/scripts/run-task-usage-limit.sh detect

      - name: Verify push triggered CI
        id: verify_push
        # Independent of run_task_summary: a resplit/comment failure must not
        # skip Verify, and Verify must not run unless Claude itself succeeded.
        if: ${{ always() && steps.claude.outcome == 'success' }}
        # O-007: no git fetch here. The remote URL holds the Claude App token,
        # which claude-code-action revokes when its step ends, so git fetch
        # failed with "Invalid username or token" (run 45323782247). verify-push.sh
        # reads the branch tip with gh api + this job's token (contents: write
        # covers reading refs; actions: read covers gh run list) and writes
        # verify_reason to GITHUB_OUTPUT for Notify.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TASK: ${{ github.event.client_payload.task }}
        run: bash .github/scripts/verify-push.sh

      # O-009: workflow-side checks on the tree Claude pushed (Claude cannot
      # skip them): report-lint on docs/reports/$TASK.md and the automatic
      # verification summary (Vitest JSON + changed files + permission
      # denials) that the next step adds to the run-task comment; O-012 adds
      # scope-check --all-non-qa on PRE_HEAD..HEAD. Runs only
      # when Claude succeeded; fails -> Notify outcome=post_check_failed.
      - name: Report lint and automatic verification summary
        id: post_check
        if: ${{ always() && steps.claude.outcome == 'success' }}
        env:
          TASK: ${{ github.event.client_payload.task }}
          LOG: ${{ steps.claude.outputs.execution_file }}
          PRE_HEAD: ${{ steps.pre_head.outputs.pre_head }}
          BRANCH: ${{ steps.pre_head.outputs.branch }}
          # O-014: post-check fetches main afresh (this token, contents read)
          # and leaves out every commit already on main from scope-check.
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          bash .github/scripts/run-task-post-check.sh

      - name: Detect denied-command resplit and post run-task summary
        id: run_task_summary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ steps.claude.outputs.execution_file }}
          TASK: ${{ github.event.client_payload.task }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: bash .github/scripts/run-task-summary-step.sh

      - name: Notify Grok chief of staff
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GROK_CHIEF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_CHIEF_WEBHOOK_KEY }}
          TASK: ${{ github.event.client_payload.task }}
          TASK_LINT_OUTCOME: ${{ steps.task_lint.outcome }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_push.outcome }}
          VERIFY_REASON: ${{ steps.verify_push.outputs.verify_reason }}
          SUMMARY_OUTCOME: ${{ steps.run_task_summary.outcome }}
          POST_CHECK_OUTCOME: ${{ steps.post_check.outcome }}
          USAGE_LIMIT: ${{ steps.usage_limit.outputs.usage_limit }}
          UL_RESET_AT: ${{ steps.usage_limit.outputs.usage_limit_reset_at }}
          UL_TYPE: ${{ steps.usage_limit.outputs.usage_limit_type }}
          UL_STREAK: ${{ steps.usage_limit.outputs.usage_limit_streak }}
          UL_ACTION: ${{ steps.usage_limit.outputs.usage_limit_action }}
          OUTCOME_FILE: ${{ runner.temp }}/run-task-outcome.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # O-007: the payload keeps `outcome` and adds claude_outcome /
          # verify_outcome / summary_outcome / verify_reason so a Verify
          # (infrastructure) failure after Claude succeeded arrives as
          # outcome=verify_failed instead of the same `failure` as a failed
          # Claude run. Not fail-open: only all-success inputs give success,
          # and this job still fails when Verify fails (O-004 B3 / P12).
          # O-008: --task-lint adds task_lint_outcome; a failed Task lint
          # gives outcome=task_lint_failed (Claude never started).
          # O-009: --post-check adds post_check_outcome; a failed report-lint /
          # verification summary after an otherwise good run gives
          # outcome=post_check_failed.
          # O-014: --usage-limit gives outcome=usage_limit (Claude failure +
          # usage limit); the payload always carries usage_limit_reset_at /
          # usage_limit_type / usage_limit_streak / usage_limit_action
          # (none / none / 0 / none unless outcome=usage_limit). The same JSON
          # is written to OUTCOME_FILE first and uploaded as
          # run-task-outcome-<task>: the next run's "previous result".
          OUTCOME_JSON="$(bash .github/scripts/run-task-outcome.sh --task-lint "${TASK_LINT_OUTCOME:-}" --post-check "${POST_CHECK_OUTCOME:-}" --usage-limit "${USAGE_LIMIT:-}" --json "${CLAUDE_OUTCOME:-}" "${VERIFY_OUTCOME:-}" "${SUMMARY_OUTCOME:-}" "${VERIFY_REASON:-}")"
          UL_FIELDS="$(bash .github/scripts/run-task-usage-limit.sh fields "$(jq -r '.outcome' <<<"$OUTCOME_JSON")")"
          OUTCOME_JSON="$(jq -cn --argjson o "$OUTCOME_JSON" --argjson u "$UL_FIELDS" '$o + $u')"
          printf '%s\n' "$OUTCOME_JSON" > "$OUTCOME_FILE"
          echo "notify ${OUTCOME_JSON}"
          if [ -z "${WEBHOOK_URL:-}" ]; then echo "Webhook not configured, skip."; exit 0; fi
          jq -n --arg task "$TASK" --arg run "$RUN_URL" --argjson o "$OUTCOME_JSON" \
            '{event: "claude-task-finished", task: $task, run: $run} + $o' \
          | curl -sS -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              --data @-

      # O-014: this run's notify JSON (outcome + usage_limit_*) for the next
      # run of the same task (Detect Claude usage limit reads the newest one
      # from another run). A missing file fails the job.
      - name: Upload run-task outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-task-outcome-${{ github.event.client_payload.task }}
          path: ${{ runner.temp }}/run-task-outcome.json
          if-no-files-found: error
          retention-days: 30
