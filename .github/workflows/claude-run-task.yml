name: Claude Run Task

on:
  repository_dispatch:
    types: [run-task]

concurrency:
  group: claude-run-task-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write — Claude Code may commit via the action; official action
      # documents repo write. Push itself uses the Claude GitHub App (OIDC),
      # but we cannot prove the action never uses GITHUB_TOKEN for repo writes.
      # Also used to post a commit comment when no PR exists yet (C3 fallback).
      contents: write
      # id-token: write — required to exchange OIDC for the Claude GitHub App token (O-002 A').
      id-token: write
      # actions: read — Verify push triggered CI uses gh run list with github.token.
      actions: read
      # pull-requests: write — C3 posts a run-task summary (denial count,
      # Duration, test excerpt) on an *existing* PR for the task branch.
      # Mode C still does not open or merge PRs. If no PR exists, we fall
      # back to a commit comment (contents: write) instead of opening one.
      pull-requests: write
    steps:
      - name: Validate task id
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: |
          if [[ ! "$TASK" =~ ^[TQOAP]-[0-9]{3}(-fix[0-9]+)?$ ]]; then
            echo "Invalid task id: $TASK"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/cursor/plugins.git"
          plugins: "pstack@cursor-plugins"
          prompt: |
            /pstack:poteto-mode 執行任務單 docs/tasks/${{ github.event.client_payload.task }}.md（任務編號 ${{ github.event.client_payload.task }}）。你在 GitHub Actions 上無人值守地執行，沒有人能回答問題，不要停下來等回覆。完整遵守 .claude/skills/run-task/SKILL.md 的步驟與限制：依任務單的分支規則工作、驗證方式以任務單為準、結果寫到 docs/reports/<任務編號>.md、commit 並推送分支、不開 PR、不合併、不動 main。
          claude_args: '--max-turns 120 --allowedTools "Read, Write, Edit, Glob, Grep, Bash(git *), Bash(pnpm install *), Bash(pnpm check *), Bash(pnpm typecheck *), Bash(pnpm lint *), Bash(pnpm arch *), Bash(pnpm test *), Bash(pnpm e2e *), Agent, TodoWrite"'

      - name: Summarize permission denials
        if: always()
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG:-}" || ! -f "$LOG" ]]; then
            echo "No execution_file; skip."
            exit 0
          fi
          DENIALS=$(jq '[.[] | select(.type=="result") | .permission_denials // []] | add // []' "$LOG")
          COUNT=$(jq 'length' <<<"$DENIALS")
          {
            echo "## Claude permission denials"
            echo "count: $COUNT"
            jq -r '.[]? | "- `\(.tool_name)`: \(.tool_input.command // "(no command field)")"' <<<"$DENIALS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$COUNT" -gt 0 ]]; then
            echo "::warning::Claude had $COUNT permission denial(s). See job summary and artifact."
          fi

      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output-${{ github.event.client_payload.task }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 7

      - name: Detect denied-command resplit and post run-task summary
        id: run_task_summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ steps.claude.outputs.execution_file }}
          TASK: ${{ github.event.client_payload.task }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG:-}" || ! -f "$LOG" ]]; then
            echo "No execution_file; skip summary and resplit check."
            exit 0
          fi
          set +e
          RESPLIT_REPORT="$(node .github/scripts/detect-resplit.mjs "$LOG")"
          RESPLIT_STATUS=$?
          set -e
          echo "$RESPLIT_REPORT"
          export RESPLIT_REPORT
          node .github/scripts/run-task-summary.mjs "$LOG" | tee "$RUNNER_TEMP/run-task-summary.md"
          # Post to an existing PR if TechLead/SRE already opened one; otherwise
          # a commit comment. Never open a PR from this workflow (mode C).
          # o004-allow: detached HEAD should not fail the summary step; posting then uses SHA.
          BRANCH="$(git branch --show-current || true)"
          if [[ ! "${BRANCH:-}" =~ ^(task|fix)/ ]]; then
            BRANCH="task/${TASK}"
          fi
          # o004-allow: no open PR is a normal mode-C state; fall back to a commit comment.
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)"
          if [[ -n "${PR_NUMBER:-}" ]]; then
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/run-task-summary.md"
            echo "Posted summary on PR #${PR_NUMBER}"
          else
            SHA="$(git rev-parse HEAD)"
            jq -n --rawfile body "$RUNNER_TEMP/run-task-summary.md" '{body:$body}' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/commits/${SHA}/comments" --input -
            echo "No open PR for ${BRANCH}; posted a commit comment on ${SHA}"
          fi
          exit "$RESPLIT_STATUS"

      - name: Verify push triggered CI
        id: verify_push
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event.client_payload.task }}
        run: bash .github/scripts/verify-push.sh

      - name: Notify Grok chief of staff
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GROK_CHIEF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_CHIEF_WEBHOOK_KEY }}
          TASK: ${{ github.event.client_payload.task }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_push.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then echo "Webhook not configured, skip."; exit 0; fi
          # Previously OUTCOME was only steps.claude.outcome, so a failed
          # "Verify push triggered CI" still reported outcome=success to 幕僚長.
          OUTCOME="$CLAUDE_OUTCOME"
          if [ "${VERIFY_OUTCOME:-skipped}" = "failure" ]; then
            OUTCOME="failure"
          fi
          echo "notify outcome=${OUTCOME} (claude=${CLAUDE_OUTCOME} verify=${VERIFY_OUTCOME:-skipped})"
          jq -n --arg task "$TASK" --arg outcome "$OUTCOME" --arg run "$RUN_URL" \
            '{event: "claude-task-finished", task: $task, outcome: $outcome, run: $run}' \
          | curl -sS -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              --data @-
