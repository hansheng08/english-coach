name: Claude Run Task

on:
  repository_dispatch:
    types: [run-task]

concurrency:
  group: claude-run-task-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # contents: write — Claude Code may commit via the action; official action
      # documents repo write. Push itself uses the Claude GitHub App (OIDC),
      # but we cannot prove the action never uses GITHUB_TOKEN for repo writes.
      # Also used to post a commit comment when no PR exists yet (C3 fallback).
      contents: write
      # id-token: write — required to exchange OIDC for the Claude GitHub App token (O-002 A').
      id-token: write
      # actions: read — Verify push triggered CI uses gh run list with github.token.
      actions: read
      # pull-requests: write — C3 posts a run-task summary (denial count,
      # Duration, test excerpt) on an *existing* PR for the task branch.
      # If no PR exists, or gh pr comment returns HTTP 403, post a commit
      # comment instead (contents: write). This step does not open a PR.
      pull-requests: write
    steps:
      - name: Validate task id
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: |
          if [[ ! "$TASK" =~ ^[TQOAP]-[0-9]{3}(-fix[0-9]+)?$ ]]; then
            echo "Invalid task id: $TASK"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/cursor/plugins.git"
          plugins: "pstack@cursor-plugins"
          prompt: |
            /pstack:poteto-mode 執行任務單 docs/tasks/${{ github.event.client_payload.task }}.md（任務編號 ${{ github.event.client_payload.task }}）。你在 GitHub Actions 上無人值守地執行，沒有人能回答問題，不要停下來等回覆。完整遵守 .claude/skills/run-task/SKILL.md 的步驟與限制：依任務單的分支規則工作、驗證方式以任務單為準、結果寫到 docs/reports/<任務編號>.md、commit 並推送分支、不開 PR、不合併、不動 main。
          claude_args: '--max-turns 200 --allowedTools "Read, Write, Edit, Glob, Grep, Bash(git *), Bash(pnpm install --frozen-lockfile*), Bash(pnpm install --no-frozen-lockfile), Bash(pnpm check *), Bash(pnpm typecheck *), Bash(pnpm lint *), Bash(pnpm arch *), Bash(pnpm test *), Bash(pnpm e2e *), Agent, TodoWrite"'

      - name: Summarize permission denials
        if: always()
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG:-}" || ! -f "$LOG" ]]; then
            if [[ "${CLAUDE_OUTCOME}" == "success" ]]; then
              echo "ERROR: claude outcome is success but execution_file is missing or unreadable: '${LOG}'"
              exit 1
            fi
            echo "No execution_file; skip denial summary (claude outcome=${CLAUDE_OUTCOME:-unknown})."
            exit 0
          fi
          DENIALS=$(jq '[.[] | select(.type=="result") | .permission_denials // []] | add // []' "$LOG")
          COUNT=$(jq 'length' <<<"$DENIALS")
          {
            echo "## Claude permission denials"
            echo "count: $COUNT"
            jq -r '.[]? | "- `\(.tool_name)`: \(.tool_input.command // "(no command field)")"' <<<"$DENIALS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$COUNT" -gt 0 ]]; then
            echo "::warning::Claude had $COUNT permission denial(s). See job summary and artifact."
          fi

      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output-${{ github.event.client_payload.task }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 7

      - name: Verify push triggered CI
        id: verify_push
        # Independent of run_task_summary: a resplit/comment failure must not
        # skip Verify, and Verify must not run unless Claude itself succeeded.
        if: ${{ always() && steps.claude.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event.client_payload.task }}
        run: bash .github/scripts/verify-push.sh

      - name: Detect denied-command resplit and post run-task summary
        id: run_task_summary
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LOG: ${{ steps.claude.outputs.execution_file }}
          TASK: ${{ github.event.client_payload.task }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: bash .github/scripts/run-task-summary-step.sh

      - name: Notify Grok chief of staff
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GROK_CHIEF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_CHIEF_WEBHOOK_KEY }}
          TASK: ${{ github.event.client_payload.task }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_push.outcome }}
          SUMMARY_OUTCOME: ${{ steps.run_task_summary.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_URL:-}" ]; then echo "Webhook not configured, skip."; exit 0; fi
          # Include run_task_summary: a failed/skipped summary with claude=success
          # must not notify 幕僚長 as outcome=success (O-004 B3 / P12).
          # run-task-outcome.sh normalizes every input and only ever prints
          # success | failure | cancelled (O-005 / B-003).
          OUTCOME="$(bash .github/scripts/run-task-outcome.sh "${CLAUDE_OUTCOME:-}" "${VERIFY_OUTCOME:-}" "${SUMMARY_OUTCOME:-}")"
          echo "notify outcome=${OUTCOME} (claude=${CLAUDE_OUTCOME} verify=${VERIFY_OUTCOME:-} summary=${SUMMARY_OUTCOME:-})"
          jq -n --arg task "$TASK" --arg outcome "$OUTCOME" --arg run "$RUN_URL" \
            '{event: "claude-task-finished", task: $task, outcome: $outcome, run: $run}' \
          | curl -sS -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              --data @-
