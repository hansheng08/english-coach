name: Claude Run Task

on:
  repository_dispatch:
    types: [run-task]

concurrency:
  group: claude-run-task-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Validate task id
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: |
          if [[ ! "$TASK" =~ ^[TQOAP]-[0-9]{3}(-fix[0-9]+)?$ ]]; then
            echo "Invalid task id: $TASK"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/cursor/plugins.git"
          plugins: "pstack@cursor-plugins"
          prompt: |
            /pstack:poteto-mode 執行任務單 docs/tasks/${{ github.event.client_payload.task }}.md（任務編號 ${{ github.event.client_payload.task }}）。你在 GitHub Actions 上無人值守地執行，沒有人能回答問題，不要停下來等回覆。完整遵守 .claude/skills/run-task/SKILL.md 的步驟與限制：依任務單的分支規則工作、驗證方式以任務單為準、結果寫到 docs/reports/<任務編號>.md、commit 並推送分支、不開 PR、不合併、不動 main。
          claude_args: '--max-turns 120 --allowedTools "Read, Write, Edit, Glob, Grep, Bash(git *), Bash(pnpm install *), Bash(pnpm check *), Bash(pnpm typecheck *), Bash(pnpm lint *), Bash(pnpm arch *), Bash(pnpm test *), Bash(pnpm e2e *), Agent, TodoWrite"'

      - name: Summarize permission denials
        if: always()
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [[ -z "${LOG:-}" || ! -f "$LOG" ]]; then
            echo "No execution_file; skip."
            exit 0
          fi
          DENIALS=$(jq '[.[] | select(.type=="result") | .permission_denials // []] | add // []' "$LOG")
          COUNT=$(jq 'length' <<<"$DENIALS")
          {
            echo "## Claude permission denials"
            echo "count: $COUNT"
            jq -r '.[]? | "- `\(.tool_name)`: \(.tool_input.command // "(no command field)")"' <<<"$DENIALS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$COUNT" -gt 0 ]]; then
            echo "::warning::Claude had $COUNT permission denial(s). See job summary and artifact."
          fi

      - name: Upload Claude execution output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-execution-output-${{ github.event.client_payload.task }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 7

      - name: Verify push triggered CI
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ github.event.client_payload.task }}
        run: |
          set -euo pipefail
          BRANCH=$(git branch --show-current)
          if [[ ! "$BRANCH" =~ ^(task|fix)/ ]]; then
            BRANCH="task/${TASK}"
          fi
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          if ! git rev-parse --verify "origin/${BRANCH}" >/dev/null 2>&1; then
            echo "No origin/${BRANCH}; skip CI verify (Claude may not have pushed)."
            exit 0
          fi
          SHA=$(git rev-parse "origin/${BRANCH}")
          echo "Looking for ci.yml run event=push branch=${BRANCH} sha=${SHA}"
          for i in $(seq 1 12); do
            RUN_JSON=$(gh run list --workflow ci.yml --branch "${BRANCH}" --event push --limit 20 --json databaseId,headSha,event,status,conclusion,url,createdAt)
            MATCH=$(jq -c --arg sha "$SHA" '[.[] | select(.headSha==$sha)]' <<<"$RUN_JSON")
            if [[ $(jq 'length' <<<"$MATCH") -gt 0 ]]; then
              echo "$MATCH" | jq .
              echo "Found push-triggered CI run for ${SHA}"
              exit 0
            fi
            echo "Attempt ${i}/12: no matching push CI run yet, waiting 15s..."
            sleep 15
          done
          echo "ERROR: no event=push ci.yml run found for ${BRANCH} @ ${SHA} after ~180s"
          gh run list --workflow ci.yml --branch "${BRANCH}" --limit 10
          exit 1

      - name: Notify Grok chief of staff
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GROK_CHIEF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_CHIEF_WEBHOOK_KEY }}
          TASK: ${{ github.event.client_payload.task }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "Webhook not configured, skip."; exit 0; fi
          jq -n --arg task "$TASK" --arg outcome "$OUTCOME" --arg run "$RUN_URL" \
            '{event: "claude-task-finished", task: $task, outcome: $outcome, run: $run}' \
          | curl -sS -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              --data @-
