name: Claude Run Task

on:
  repository_dispatch:
    types: [run-task]

concurrency:
  group: claude-run-task-${{ github.event.client_payload.task }}
  cancel-in-progress: false

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Validate task id
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: |
          if [[ ! "$TASK" =~ ^[TQOAP]-[0-9]{3}(-fix[0-9]+)?$ ]]; then
            echo "Invalid task id: $TASK"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/run-task ${{ github.event.client_payload.task }}"
          claude_args: "--max-turns 80"

      - name: Notify Grok chief of staff
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GROK_CHIEF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.GROK_CHIEF_WEBHOOK_KEY }}
          TASK: ${{ github.event.client_payload.task }}
          OUTCOME: ${{ steps.claude.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then echo "Webhook not configured, skip."; exit 0; fi
          jq -n --arg task "$TASK" --arg outcome "$OUTCOME" --arg run "$RUN_URL" \
            '{event: "claude-task-finished", task: $task, outcome: $outcome, run: $run}' \
          | curl -sS -X POST "$WEBHOOK_URL" \
              -H "Authorization: Bearer $WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              --data @-
